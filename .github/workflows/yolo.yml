name: YOLO
on:
  pull_request:
    types: [ labeled ]

jobs:
  build:
    if: ${{ github.event.label.name == 'YOLO' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Approve pull request
        run: gh pr review "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --approve
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
